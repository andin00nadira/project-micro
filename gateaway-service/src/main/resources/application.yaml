server:
    port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: authentication-service
            uri: lb://AUTHENTICATION-SERVICE
            predicates:
            - Path=/auth/**
          - id: produk
            uri: lb://PRODUK
            predicates:
            - Path=/api/produk/**
          - id: order-service
            uri: lb://ORDER-SERVICE
            predicates:
            - Path=/api/order/**
          - id: pelanggan
            uri: lb://PELANGGAN
            predicates:
            - Path=/api/pelanggan/**
          - id: produser
            uri: lb://PRODUCER
            predicates:
            - Path=/api/send/**
          - id: consumer
            uri: lb://CONSUMER
            predicates:
            - Path=/api/consumer/**

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            show-details: always
              
              
